<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Partials preview (dev) — LoneStar Support</title>
  <link rel="stylesheet" href="css/site.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: "#001F3F",
            sage: "#A8CABA",
            terracotta: "#C8102E",
            cream: "#F8F1E9",
            ink: "#1F2937",
          },
          fontFamily: {
            serif: ['Georgia', 'Times New Roman', 'Times', 'serif'],
            sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-cream text-ink antialiased">
  <p class="mx-auto max-w-3xl px-4 py-6 text-center text-sm text-ink/75">
    <strong>Dev preview.</strong> Navbar and footer are loaded from <code class="rounded bg-navy/10 px-1 py-0.5 text-xs">partials/</code> (same as production). For full pages, open
    <a class="font-semibold text-terracotta underline-offset-2 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-terracotta" href="index.html">index.html</a>.
    <span class="whitespace-nowrap">Do not deploy this URL publicly—it uses <code class="text-xs">noindex</code>.</span>
  </p>

  <div id="site-nav" aria-busy="true"></div>

  <main id="main-content" class="px-4 py-12">
    <p class="mx-auto max-w-xl text-center text-ink/80">
      Edit <code class="rounded border border-navy/10 bg-white px-1.5 py-0.5 text-sm shadow-sm">partials/navbar.html</code>
      or <code class="rounded border border-navy/10 bg-white px-1.5 py-0.5 text-sm shadow-sm">partials/footer.html</code> and save; your live-reload tab should refresh.
    </p>
  </main>

  <div id="site-footer" aria-busy="true"></div>

  <script src="assets/js/includes.js" defer></script>
</body>
</html>
